backend:
  name: github
  repo: sayliks/astro-paper
  branch: main
  squash_merges: true
  auth_type: implicit
  base_url: https://matsumae.top
  # Create a GitHub OAuth App at https://github.com/settings/developers
  # Set "Homepage URL" to https://matsumae.top
  # Set "Authorization callback URL" to https://matsumae.top/
  # Paste the Client ID below:
  app_id: YOUR_GITHUB_OAUTH_APP_CLIENT_ID

publish_mode: editorial_workflow

site_url: "https://matsumae.top"
display_url: "https://matsumae.top"
logo_url: /favicon.svg

media_folder: public/assets/uploads
public_folder: /assets/uploads

slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    create: true
    delete: false
    filter:
      field: draft
      value: true
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} - {{pubDatetime}}"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "posts/{{slug}}/"
    editor:
      preview: false
    fields:
      - label: Title
        name: title
        widget: string

      - label: Publish Date
        name: pubDatetime
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        default: "{{now}}"

      - label: Description
        name: description
        widget: text

      - label: Tags
        name: tags
        widget: list
        min: 1
        default:
          - 随笔
        field:
          label: Tag
          name: tag
          widget: string

      - label: Draft
        name: draft
        widget: boolean
        default: true

      - label: Featured
        name: featured
        widget: boolean
        default: false

      - label: OG Image
        name: ogImage
        widget: image
        required: false

      - label: Canonical URL
        name: canonicalURL
        widget: string
        required: false

      - label: Timezone
        name: timezone
        widget: string
        required: false
        default: Asia/Hong_Kong

      - label: Body
        name: body
        widget: markdown
